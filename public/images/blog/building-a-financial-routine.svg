    <!-- Row 2 -->
    <circle cx="80" cy="170" r="18" fill="#0a0a0a" opacity="0.08"/>
    <path d="M72 170 L78 176 L90 164" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="170" cy="170" r="18" fill="#0a0a0a" opacity="0.08"/>
    <path d="M162 170 L168 176 L180 164" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="260" cy="170" r="18" fill="#0a0a0a" opacity="0.08"/>
    <path d="M252 170 L258 176 L270 164" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="350" cy="170" r="18" fill="#0a0a0a" opacity="0.08"/>
    <path d="M342 170 L348 176 L360 164" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="440" cy="170" r="18" fill="#0a0a0a" opacity="0.08"/>
