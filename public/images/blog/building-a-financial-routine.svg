    <circle cx="80" cy="290" r="18" fill="#0a0a0a" opacity="0.08"/>
    <circle cx="170" cy="290" r="18" fill="#0a0a0a" opacity="0.08"/>
    <circle cx="260" cy="290" r="18" fill="#0a0a0a" opacity="0.08"/>
    <circle cx="350" cy="290" r="18" fill="#0a0a0a" opacity="0.08"/>
    <circle cx="440" cy="290" r="18" fill="#0a0a0a" opacity="0.08"/>
    <!-- "5 min" text -->
    <text x="260" y="355" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#a3a3a3">5 min / day</text>
