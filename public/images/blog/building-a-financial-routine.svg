    <rect x="0" y="30" width="520" height="30" fill="#0a0a0a"/>
    <!-- Day dots - 5x4 grid representing a month, some checked -->
    <!-- Row 1 -->
    <circle cx="80" cy="110" r="18" fill="#0a0a0a" opacity="0.08"/>
    <path d="M72 110 L78 116 L90 104" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
