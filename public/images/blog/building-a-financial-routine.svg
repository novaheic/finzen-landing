    <circle cx="80" cy="230" r="18" fill="#0a0a0a" opacity="0.08"/>
    <path d="M72 230 L78 236 L90 224" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="170" cy="230" r="18" fill="#0a0a0a" opacity="0.08"/>
    <circle cx="260" cy="230" r="18" fill="#0a0a0a" opacity="0.08"/>
    <circle cx="350" cy="230" r="18" fill="#0a0a0a" opacity="0.08"/>
    <circle cx="440" cy="230" r="18" fill="#0a0a0a" opacity="0.08"/>
