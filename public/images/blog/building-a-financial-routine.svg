    <circle cx="260" cy="110" r="18" fill="#0a0a0a" opacity="0.08"/>
    <path d="M252 110 L258 116 L270 104" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="350" cy="110" r="18" fill="#0a0a0a" opacity="0.08"/>
    <path d="M342 110 L348 116 L360 104" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
