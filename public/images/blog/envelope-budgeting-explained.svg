<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#ECECEC"/>
  <!-- Envelope shapes -->
  <g transform="translate(600, 260)">
    <!-- Main envelope -->
    <rect x="-120" y="-60" width="240" height="150" rx="12" fill="#fff" stroke="#d4d4d4" stroke-width="2"/>
    <path d="M-120 -48 L0 40 L120 -48" stroke="#a3a3a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dollar sign -->
    <text x="0" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="#404040">$</text>
    <!-- Smaller envelopes -->
    <rect x="-280" y="0" width="120" height="75" rx="8" fill="#fff" stroke="#d4d4d4" stroke-width="1.5" opacity="0.6"/>
    <path d="M-280 8 L-220 48 L-160 8" stroke="#a3a3a3" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <rect x="160" y="0" width="120" height="75" rx="8" fill="#fff" stroke="#d4d4d4" stroke-width="1.5" opacity="0.6"/>
    <path d="M160 8 L220 48 L280 8" stroke="#a3a3a3" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>
  <!-- Divider lines representing budget categories -->
  <g transform="translate(600, 460)" opacity="0.4">
    <rect x="-200" y="0" width="130" height="6" rx="3" fill="#a3a3a3"/>
    <rect x="-50" y="0" width="100" height="6" rx="3" fill="#a3a3a3"/>
    <rect x="70" y="0" width="150" height="6" rx="3" fill="#a3a3a3"/>
    <rect x="-200" y="20" width="80" height="6" rx="3" fill="#d4d4d4"/>
    <rect x="-100" y="20" width="160" height="6" rx="3" fill="#d4d4d4"/>
    <rect x="80" y="20" width="110" height="6" rx="3" fill="#d4d4d4"/>
  </g>
</svg>
