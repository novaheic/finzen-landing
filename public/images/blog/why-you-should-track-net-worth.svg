<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#ECECEC"/>
  <!-- Upward trend line chart -->
  <g transform="translate(200, 100)">
    <!-- Grid lines -->
    <line x1="0" y1="400" x2="800" y2="400" stroke="#d4d4d4" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#d4d4d4" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#d4d4d4" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#d4d4d4" stroke-width="0.5" opacity="0.5"/>
    <!-- Area fill -->
    <path d="M0 380 Q100 370 160 350 Q240 320 320 280 Q400 250 480 200 Q560 160 640 120 Q720 90 800 50 L800 400 L0 400 Z" fill="#0a0a0a" opacity="0.04"/>
    <!-- Main line -->
    <path d="M0 380 Q100 370 160 350 Q240 320 320 280 Q400 250 480 200 Q560 160 640 120 Q720 90 800 50" stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Data points -->
    <circle cx="0" cy="380" r="5" fill="#0a0a0a"/>
    <circle cx="160" cy="350" r="5" fill="#0a0a0a"/>
    <circle cx="320" cy="280" r="5" fill="#0a0a0a"/>
    <circle cx="480" cy="200" r="5" fill="#0a0a0a"/>
    <circle cx="640" cy="120" r="5" fill="#0a0a0a"/>
    <circle cx="800" cy="50" r="6" fill="#0a0a0a"/>
    <!-- Arrow at end -->
    <path d="M785 55 L800 50 L790 65" stroke="#0a0a0a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
